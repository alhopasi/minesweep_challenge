services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    volumes:
      - ./data:/data
    ports:
      - "80:80"
    environment:
      - FLASK_ENV=production
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: